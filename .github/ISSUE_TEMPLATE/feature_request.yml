name: Feature request
description: Suggest an improvement or new capability for TrafficLens
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the idea below.

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: A short, one-sentence description of the idea.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish? What is difficult or missing today?
      placeholder: |
        When I want to ...
        I currently have to ...
        This is tedious because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like TrafficLens to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the request, including screenshots if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked existing issues for similar ideas.
          required: true
